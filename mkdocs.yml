site_name: Angular + AI Learning Path
site_description: A 24-week plan for an Angular developer learning AI, with weekly notes, labs and projects.
site_author: Subhrangsu Bera
site_url: https://subhrangsu90.github.io/angular_ai/
repo_url: https://github.com/Subhrangsu90/angular_ai
repo_name: Subhrangsu90/angular_ai
edit_uri: edit/main/

# Markdown lives in the repo root, next to this file (needs the same-dir plugin).
docs_dir: .
exclude_docs: |
  .*
  /site/
  /requirements.txt
  /mkdocs.yml

theme:
  name: material
  custom_dir: .mkdocs/overrides   # home.html + assets/journey/*
  font:
    text: Instrument Sans
    code: IBM Plex Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant          # page changes without a full reload
    - navigation.instant.progress
    - navigation.indexes          # a folder's README.md is the section's landing page
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
    - toc.follow

extra_css:
  - assets/journey/journey.css
extra_javascript:
  - assets/journey/journey.js

plugins:
  - same-dir
  - search

hooks:
  - .mkdocs/nav_titles.py
  - .mkdocs/journey.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true

validation:
  links:
    unrecognized_links: ignore   # folder links like ./phase-1-ai-fundamentals/ are fine
